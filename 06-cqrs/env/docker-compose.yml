services:
  postgres-write:
    image: postgres:18-alpine
    container_name: progression-postgres-write
    environment:
      POSTGRES_DB: game_progression_write_db
      POSTGRES_USER: game_progression_write_user
      POSTGRES_PASSWORD: game_progression_write_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U game_progression_write_user -d game_progression_write_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-progression-net

  mongo-read:
    image: mongo:8.3.4-noble
    container_name: progression-mongo-read
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "27017:27017"
    #    volumes:
    #      - mongo_read_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game-progression-net

  mongo-init:
    image: mongo:8.3.4-noble
    container_name: progression-mongo-init
    depends_on:
      mongo-read:
        condition: service_healthy
    command: >
      sh -c "
        mongosh --host mongo-read:27017 --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({
              _id: \"rs0\",
              members: [
                { _id: 0, host: \"mongo-read:27017\" }
              ]
            });
          }
        '
      "
    restart: "no"
    networks:
      - game-progression-net

  kafka:
    image: apache/kafka:4.1.2
    container_name: progression-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    command: >
      bash -c "
              /etc/kafka/docker/run &
              KAFKA_PID=$$!

              echo 'Waiting for Kafka to be ready...'
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1; do
                sleep 2
              done

              echo 'Creating topic game.progression.events...'
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic game.progression.events --partitions 3 --replication-factor 1

              wait $$KAFKA_PID
            "
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - game-progression-net

  game-progression-write:
    build:
      context: ..
      dockerfile: game-progression-write/Dockerfile
    container_name: progression-game-write
    depends_on:
      postgres-write:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-write:5432/game_progression_write_db
      DATABASE_USERNAME: game_progression_write_user
      DATABASE_PASSWORD: game_progression_write_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - game-progression-net

  game-progression-reader:
    build:
      context: ..
      dockerfile: game-progression-reader/Dockerfile
    container_name: progression-game-reader
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: mongodb://mongo-read:27017/progression_read_db?replicaSet=rs0&uuidRepresentation=standard
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - game-progression-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: progression-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - game-progression-net

networks:
  game-progression-net:
    driver: bridge
