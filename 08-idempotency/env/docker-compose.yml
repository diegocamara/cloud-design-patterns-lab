services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: idempotency_db
      POSTGRES_USER: idempotency_user
      POSTGRES_PASSWORD: idempotency_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U idempotency_user -d idempotency_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idempotency-net
  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: idempotency_user
      RABBITMQ_DEFAULT_PASS: idempotency_pass
      RABBITMQ_DEFAULT_VHOST: idempotency
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - idempotency-net
networks:
  idempotency-net:
    driver: bridge
